<svg width="800" height="170" viewBox="0 0 800 170" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="mainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e9d8fd"/>
      <stop offset="45%" stop-color="#c4b5fd"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="shineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="textClip">
      <text x="400" y="105" font-family="Arial, Helvetica, sans-serif" font-size="66" font-weight="900" text-anchor="middle" letter-spacing="2">Akshar Pastagia</text>
    </clipPath>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g id="wobble">
    <animateTransform attributeName="transform" type="rotate" values="-1.2 400 85; 1.2 400 85; -1.2 400 85" dur="6s" repeatCount="indefinite"/>

    <text x="411" y="116" font-family="Arial, Helvetica, sans-serif" font-size="66" font-weight="900" text-anchor="middle" letter-spacing="2" fill="#0f0c29">Akshar Pastagia</text>
    <text x="409" y="114" font-family="Arial, Helvetica, sans-serif" font-size="66" font-weight="900" text-anchor="middle" letter-spacing="2" fill="#150f36">Akshar Pastagia</text>
    <text x="407" y="112" font-family="Arial, Helvetica, sans-serif" font-size="66" font-weight="900" text-anchor="middle" letter-spacing="2" fill="#1d1244">Akshar Pastagia</text>
    <text x="405" y="110" font-family="Arial, Helvetica, sans-serif" font-size="66" font-weight="900" text-anchor="middle" letter-spacing="2" fill="#241552">Akshar Pastagia</text>
    <text x="403" y="108" font-family="Arial, Helvetica, sans-serif" font-size="66" font-weight="900" text-anchor="middle" letter-spacing="2" fill="#2b1860">Akshar Pastagia</text>
    <text x="401" y="106" font-family="Arial, Helvetica, sans-serif" font-size="66" font-weight="900" text-anchor="middle" letter-spacing="2" fill="#321b6e">Akshar Pastagia</text>

    <text x="400" y="105" font-family="Arial, Helvetica, sans-serif" font-size="66" font-weight="900" text-anchor="middle" letter-spacing="2" fill="url(#mainGrad)" stroke="#1e1b4b" stroke-width="1.2" filter="url(#glow)">
      Akshar Pastagia
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -3; 0 0" dur="3s" repeatCount="indefinite"/>
    </text>

    <rect x="-220" y="0" width="160" height="170" fill="url(#shineGrad)" clip-path="url(#textClip)" transform="skewX(-18)">
      <animate attributeName="x" values="-220;900;900" keyTimes="0;0.55;1" dur="3.4s" repeatCount="indefinite"/>
    </rect>
  </g>

  <text x="400" y="150" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="500" text-anchor="middle" letter-spacing="3" fill="#a78bfa" opacity="0.85">FINANCIAL OPERATIONS ANALYST</text>
</svg>
